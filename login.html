<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page - EcoVein</title>
</head>
<body>

    <h2>Login Page</h2>

    <main>
        <section>

            <!-- Logo -->
            <div>
                <img src="logo-ecovein.png" alt="Logo EcoVein" width="150">
                <h1>EcoVein</h1>
            </div>

            <!-- Judul -->
            <h2>Selamat Datang!</h2>

            <!-- Form Login -->
            <form action="#" method="post">

                <div>
                    <label for="email">Email atau username</label><br>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Email atau username"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="password">Password</label><br>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                    >
                </div>

                <br>

                <div>
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Ingat Saya</label>

                    &nbsp;&nbsp;&nbsp;

                    <a href="#">Lupa password?</a>
                </div>

                <br>

                <button type="submit">Login</button>

            </form>

            <br>

            <!-- Divider -->
            <div>
                <hr>
                <p>atau</p>
                <hr>
            </div>

            <!-- Login Google -->
            <button type="button">
                Login Dengan Google
            </button>

            <br><br>

            <!-- Register -->
            <p>
                Belum punya akun?
                <a href="#">Daftar disini</a>
            </p>

        </section>
    </main>

</body>
</html>
